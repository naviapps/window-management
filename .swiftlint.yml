# Default bug-oriented rules plus targeted opt-ins; swift-format owns layout.
# Encoding choices, naming, metrics and TODO policy remain outside this gate.
only_rules:
  - blanket_disable_command
  - class_delegate_protocol
  - compiler_protocol_init
  - deployment_target
  - discarded_notification_center_observer
  - discouraged_direct_init
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - identical_operands
  - invalid_swiftlint_command
  - invisible_character
  - notification_center_detachment
  - ns_number_init_as_function_reference
  - nsobject_prefer_isequal
  - orphaned_doc_comment
  - private_unit_test
  - redundant_sendable
  - self_in_property_initialization
  - superfluous_disable_command
  - unneeded_override
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_parameter
  - unused_setter_value
  - valid_ibinspectable
analyzer_rules:
  - unused_declaration
  - unused_import
unused_declaration:
  severity: warning
  include_public_and_open: false
unused_import:
  severity: warning
strict: true

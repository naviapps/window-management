language = "C"
style = "type"
include_guard = "WINDOW_MANAGEMENT_H"
header = "// Generated by cbindgen from the Rust FFI sources.\n// clang-format off"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "c99"

[parse]
parse_deps = true
include = ["window-management"]

[export.rename]
Rect = "WindowManagementRect"
Display = "WindowManagementDisplay"
RectResult = "WindowManagementRectResult"
PlacementValue = "WindowManagementPlacement"
PlacementResult = "WindowManagementPlacementResult"
SelectionValue = "WindowManagementDisplayTarget"
SelectionResult = "WindowManagementDisplayTargetResult"
PlacementRequestValue = "WindowManagementPlacementRequest"
MoveRequestValue = "WindowManagementMoveRequest"
MovementPlanResult = "WindowManagementMovementPlanResult"
Json = "WindowManagementJson"
JsonView = "WindowManagementJsonView"
WindowFilter = "WindowManagementWindowFilter"
Identity = "WindowManagementWindowIdentity"
IdentityResult = "WindowManagementWindowIdentityResult"
WindowView = "WindowManagementWindowView"
Query = "WindowManagementQuery"
QueryView = "WindowManagementQueryView"

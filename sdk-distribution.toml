[macos]
commands = [
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution"],
  ["sdk-tooling", "swift-consumer", "--distribution"],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["cargo", "fmt", "--all", "--", "--check"],
  [
    "sdk-tooling",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "distribution/tests",
  ],
  [
    "sdk-tooling",
    "windows",
    "distribution/verify_windows.py",
    "--skip-desktop",
  ],
]

[macos]
commands = [
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution", "test-installed-consumers", "test-c", "test-dotnet"],
  ["python", "-I", "-B", "{tooling}/tasks/sdk", "swift-consumer", "--distribution"],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["cargo", "fmt", "--all", "--", "--check"],
  [
    "python",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "fixtures/distribution/tests",
  ],
  [
    "python",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "windows",
    "fixtures/distribution/check-ci.py",
    "--skip-desktop",
  ],
]

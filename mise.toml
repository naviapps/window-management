[settings]
# Keep the pinned Python ahead of the system copy inside Make recipes.
activate_aggressive = true
idiomatic_version_file_enable_tools = ["rust", "dotnet"]

[tools]
python = "3.15.2"
ruff = "0.17.6"
dprint = "0.65.0"
jactionlint = "2.6.0"
swiftlint = { version = "0.65.1", os = ["macos"] }
uv = "0.13.10"
"cargo:cbindgen" = "0.29.4"
"github:bnjbvr/cargo-machete" = { version = "0.10.1", platforms.windows-arm64.asset_pattern = "*-x86_64-pc-windows-msvc.tar.gz" }

[tasks.sdk-tooling]
description = "Run the pinned shared SDK checks"
run = "uvx --from git+https://github.com/naviapps/sdk-tooling.git@fd6410ecc7b907d524d50077f2750b7bfed5bf37 sdk-tooling"

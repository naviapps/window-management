name: Windows x64 SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full SDK checks when pinned dependencies can be fetched anonymously
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-x64-${{ github.ref }}-${{ inputs.full || false }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      MSBUILDDISABLENODEREUSE: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          architecture: x64
      - name: Select the pinned Rust toolchain and check formatting
        run: cargo fmt --all -- --check
      - name: Test the Rust workspace on Windows x64
        if: ${{ github.event.repository.private && !inputs.full }}
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc
      - name: Run tooling fixtures without private dependencies
        if: ${{ github.event.repository.private && !inputs.full }}
        env:
          NAVI_SDK_TOOLING_OFFLINE: "1"
        run: python -E -S -B -m unittest discover -s tools/tests
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !github.event.repository.private || inputs.full }}
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "10.0.403"
          architecture: x64
      - name: Run Windows x64 tooling fixtures
        if: ${{ !github.event.repository.private || inputs.full }}
        run: python -E -S -B -m unittest discover -s tools/tests
      - name: Build the x64 DLL and validate C, .NET and installed NuGet consumers
        if: ${{ !github.event.repository.private || inputs.full }}
        shell: python
        run: |
          import json, os, shutil, subprocess, sys
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          tooling = temp / 'sdk-tooling'
          revision = json.loads(Path('tools/tooling-sources.json').read_text(encoding='utf-8'))['naviapps/sdk-tooling']
          subprocess.run(['git', 'init', '--quiet', tooling], check=True)
          subprocess.run([
              'git', '-C', tooling, '-c', 'credential.helper=', 'fetch', '--depth=1',
              'https://github.com/naviapps/sdk-tooling.git', revision,
          ], check=True)
          subprocess.run(['git', '-C', tooling, 'checkout', '--quiet', '--detach', 'FETCH_HEAD'], check=True)
          dotnet = shutil.which('dotnet.exe')
          if not dotnet:
              raise SystemExit('The pinned x64 .NET SDK was not installed.')
          subprocess.run([
              sys.executable, '-E', '-S', '-B', 'tools/check-ci.py', '--skip-desktop',
              '--tooling-source', tooling, '--tooling-revision', revision,
          ], env=dict(os.environ, DOTNET_BIN=dotnet, NAVI_CI_ARTIFACTS=str(temp / 'sdk-acceptance')), check=True)

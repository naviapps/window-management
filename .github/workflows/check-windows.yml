name: Windows x64 SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Test Rust and .NET
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      MSBUILDDISABLENODEREUSE: "1"
      GIT_TERMINAL_PROMPT: "0"
      CARGO_BUILD_TARGET: "x86_64-pc-windows-msvc"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: naviapps/sdk-tooling/.github/actions/test-rust-windows@2f938131cb4deae08ce8bf092ebb4dee16723dd1
      - uses: actions/setup-dotnet@v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "10.0.403"
          architecture: x64
      - name: Build native binding library
        run: cargo build --locked -p window-management-ffi
      - name: Test .NET bindings
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'NaviApps.WindowManagement.Tests'
          dotnet build bindings/dotnet/tests/NaviApps.WindowManagement.Tests/NaviApps.WindowManagement.Tests.csproj --configuration Release --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "target/$env:CARGO_BUILD_TARGET/debug/window_management_ffi.dll" $output
          dotnet (Join-Path $output 'NaviApps.WindowManagement.Tests.dll')

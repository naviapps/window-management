name: Windows x64 SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    uses: naviapps/sdk-tooling/.github/workflows/check-sdk-windows.yml@2ec2db1d8629260420885a5c8a9e0f836cdead6f
    with:
      validation-arguments: '["tools/check-ci.py", "--skip-desktop"]'
      check-rust-format: true

name: macOS SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GIT_TERMINAL_PROMPT: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Swift toolchain
        run: xcrun swift --version
      - name: Install tools for standalone consumers and artifacts
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          cache: false
          add_shims_to_path: false
      - name: Fetch locked Rust dependencies
        run: mise exec -- cargo fetch --locked
      - name: Validate SDK and consumers
        run: mise exec -- make check test-installed-consumers test-c test-dotnet

  macos-26:
    name: macOS 26 compatibility
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: xcrun swift --version
      - name: Test Swift compatibility
        run: xcrun swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

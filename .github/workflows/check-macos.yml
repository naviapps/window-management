name: macOS SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    name: Swift checks (macOS ${{ matrix.macos }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: "26"
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
          - macos: "27"
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: |
          sw_vers
          xcrun swift --version
      - name: Test Swift SDK
        run: xcrun swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Test standalone Swift consumer
        run: python3 -B tools/consumer.py

  contributor:
    name: Source checks
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GIT_TERMINAL_PROMPT: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install contributor tools
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          cache: false
          add_shims_to_path: false
      - name: Fetch locked Rust dependencies
        run: mise exec -- cargo fetch --locked
      - name: Check source and bindings
        run: mise exec -- make check-source

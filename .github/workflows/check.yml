name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to check
        type: choice
        default: all
        options: [all, macos, windows]
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.event_name == 'push' && github.run_id || github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  check:
    uses: naviapps/sdk-tooling/.github/workflows/check-sdk.yml@40c6bf76530e61fc427db4b4ec8b7f8cf969f562
    with:
      platform: ${{ inputs.platform || 'all' }}
      windows: bindings
